name: Format Emery Improvement Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-improvement-final.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Format final improvement file
        run: npx prettier --write src/lib/improvement.functions.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "Adamspersonalaiassistant"
          git config user.email "adam.emailassistant@gmail.com"
          git add src/lib/improvement.functions.ts
          git commit -m "Finish Emery self-improvement formatting"
          git push origin HEAD:main
