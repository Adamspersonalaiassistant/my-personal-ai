name: Apply HPO Activity Upgrade

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-hpo-activity-upgrade.mjs'
      - 'scripts/apply-hpo-activity-upgrade-v2.mjs'
      - '.github/workflows/apply-hpo-activity-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: node scripts/apply-hpo-activity-upgrade-v2.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Focused Activity validation
        run: npm run validate:hpo-activity
      - name: Production build
        run: npm run build
      - name: Commit verified upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts package.json
          git commit -m "Connect Emery to structured HPO Activity [activity-upgrade]"
          git push origin HEAD:main
