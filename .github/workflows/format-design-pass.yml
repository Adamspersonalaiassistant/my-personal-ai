name: Format Emery Design Pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-design-pass.yml'

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Format design pass files
        run: |
          npx prettier --write \
            src/components/AppShell.tsx \
            src/components/ImprovementHealthCard.tsx \
            src/routes/_authenticated/agents.tsx \
            'src/routes/_authenticated/agents_.$agentId.tsx' \
            src/routes/_authenticated/tasks.tsx \
            src/routes/_authenticated/projects.tsx \
            src/routes/_authenticated/meetings.tsx
      - name: Production build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Emery improvement regression checks
        run: node scripts/validate-emery-improvement.mjs
      - name: Focused Emery OS lint
        run: |
          npx eslint \
            src/components/AppShell.tsx \
            src/components/ImprovementHealthCard.tsx \
            src/lib/agent-policy.ts \
            src/lib/agent.functions.ts \
            src/lib/assistant-identity.ts \
            src/lib/chat-history.functions.ts \
            src/lib/chat.functions.ts \
            src/lib/emery-intelligence.ts \
            src/lib/emery.functions.ts \
            src/lib/improvement.functions.ts \
            src/lib/memory.functions.ts \
            src/lib/os.functions.ts \
            src/routes/__root.tsx \
            src/routes/_authenticated/chat.tsx \
            src/routes/_authenticated/agents.tsx \
            'src/routes/_authenticated/agents_.$agentId.tsx' \
            src/routes/_authenticated/tasks.tsx \
            src/routes/_authenticated/projects.tsx \
            src/routes/_authenticated/meetings.tsx \
            src/routes/_authenticated/memories.tsx \
            src/routes/_authenticated/settings.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'Adamspersonalaiassistant'
          git config user.email 'adam.emailassistant@gmail.com'
          git add src/components/AppShell.tsx src/components/ImprovementHealthCard.tsx src/routes/_authenticated/agents.tsx 'src/routes/_authenticated/agents_.$agentId.tsx' src/routes/_authenticated/tasks.tsx src/routes/_authenticated/projects.tsx src/routes/_authenticated/meetings.tsx
          git commit -m 'Format Emery design pass [skip ci]'
          git push
