name: Final Lint Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-lint-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Capture focused lint
        shell: bash
        run: |
          set +e
          npx eslint \
            src/components/AppShell.tsx \
            src/lib/agent-policy.ts \
            src/lib/agent.functions.ts \
            src/lib/assistant-identity.ts \
            src/lib/chat-history.functions.ts \
            src/lib/chat.functions.ts \
            src/lib/emery-intelligence.ts \
            src/lib/emery.functions.ts \
            src/lib/memory.functions.ts \
            src/lib/os.functions.ts \
            src/routes/__root.tsx \
            src/routes/_authenticated/chat.tsx \
            src/routes/_authenticated/agents.tsx \
            'src/routes/_authenticated/agents_.$agentId.tsx' \
            src/routes/_authenticated/tasks.tsx \
            src/routes/_authenticated/projects.tsx \
            src/routes/_authenticated/meetings.tsx \
            src/routes/_authenticated/memories.tsx \
            src/routes/_authenticated/settings.tsx \
            > /tmp/final-eslint.txt 2>&1
          code=$?
          printf '# Temporary Final ESLint Diagnostic\n\nExit code: %s\n\n```text\n' "$code" > docs/FINAL_ESLINT_DIAGNOSTIC.md
          cat /tmp/final-eslint.txt >> docs/FINAL_ESLINT_DIAGNOSTIC.md
          printf '\n```\n' >> docs/FINAL_ESLINT_DIAGNOSTIC.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FINAL_ESLINT_DIAGNOSTIC.md
          git commit -m 'Capture final ESLint diagnostic [skip ci]' || true
          git push origin HEAD:main || true
          exit "$code"
