name: Final Lint Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-lint-diagnostic.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply Prettier to final lint offenders
        run: npx prettier --write src/lib/memory.functions.ts src/routes/_authenticated/memories.tsx
      - name: Production build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Focused Emery OS lint
        run: >-
          npx eslint
          src/components/AppShell.tsx
          src/lib/agent-policy.ts
          src/lib/agent.functions.ts
          src/lib/assistant-identity.ts
          src/lib/chat-history.functions.ts
          src/lib/chat.functions.ts
          src/lib/emery-intelligence.ts
          src/lib/emery.functions.ts
          src/lib/memory.functions.ts
          src/lib/os.functions.ts
          src/routes/__root.tsx
          src/routes/_authenticated/chat.tsx
          src/routes/_authenticated/agents.tsx
          'src/routes/_authenticated/agents_.$agentId.tsx'
          src/routes/_authenticated/tasks.tsx
          src/routes/_authenticated/projects.tsx
          src/routes/_authenticated/meetings.tsx
          src/routes/_authenticated/memories.tsx
          src/routes/_authenticated/settings.tsx
      - name: Commit formatting fix
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/lib/memory.functions.ts src/routes/_authenticated/memories.tsx
            git commit -m 'Finish Emery OS formatting cleanup [skip ci]'
            git push origin HEAD:main
          fi
