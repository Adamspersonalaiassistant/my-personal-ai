name: Phase 6 Unify Emery OS Fixed

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase6-unify-fix.yml

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply Phase 6 patch
        run: python scripts/phase6_patch.py
      - name: Format Phase 6 files
        run: npx prettier --write src/lib/os.functions.ts src/lib/emery.functions.ts src/components/OperatingContextCard.tsx src/components/RecentFilesCard.tsx src/components/ProjectExecutionOverview.tsx src/routes/_authenticated/chat.tsx src/routes/_authenticated/tasks.tsx src/routes/_authenticated/meetings.tsx src/routes/_authenticated/projects.tsx src/routes/_authenticated/settings.tsx
      - name: Production build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Focused lint
        run: npx eslint src/lib/os.functions.ts src/lib/emery.functions.ts src/components/OperatingContextCard.tsx src/components/RecentFilesCard.tsx src/components/ProjectExecutionOverview.tsx src/routes/_authenticated/chat.tsx src/routes/_authenticated/tasks.tsx src/routes/_authenticated/meetings.tsx src/routes/_authenticated/projects.tsx src/routes/_authenticated/settings.tsx
      - name: Mark Phase 6 complete
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/OVERNIGHT_EMERY_SPRINT_STATUS.md')
          text = p.read_text()
          old = '## Phase 6 — Unify Emery Life OS\n\nStatus: NOT STARTED'
          new = '''## Phase 6 — Unify Emery Life OS\n\nStatus: COMPLETE — production build, TypeScript, and focused lint validated.\n\nImplemented and validated:\n\n- Added a bounded, user-scoped operating-system snapshot joining active tasks, projects, upcoming meetings, recent memories, recent Emery attachments, and visible specialist agents.\n- Main Emery chat now surfaces a compact Current Context card driven by real structured data, with one highest-leverage focus and links into Tasks, Projects, Meetings, and recent files.\n- Manual Tasks can now link to active Projects; task cards show project context.\n- Meetings can now link to active Projects through existing meeting metadata; meeting cards show the relationship without a destructive schema change.\n- Projects now expose connected execution context including open-task counts and linked meeting cues.\n- Settings now surfaces recent Emery files/attachments with short-lived signed access while preserving the original conversation attachment system.\n- Emery's bounded action-context prompt now translates linked project IDs into human project names for tasks and meetings, improving answers such as “what do I have going on?” without adding a large new prompt block.\n- No Emery Voice behavior/design changes.\n\nRemaining for later phases:\n\n- Phase 7 should adopt paginated main-chat loading and complete mobile/performance polish.\n- File context remains attachment-oriented by design; no separate document library or external-drive sync was invented.\n\nValidation:\n\n- Production build passed.\n- TypeScript (`npx tsc --noEmit`) passed.\n- Focused lint passed on all changed Phase 6 files.'''
          if old not in text:
              raise SystemExit('Phase 6 status marker missing')
          p.write_text(text.replace(old, new))
          PY
      - name: Commit validated Phase 6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/os.functions.ts src/lib/emery.functions.ts src/components/OperatingContextCard.tsx src/components/RecentFilesCard.tsx src/components/ProjectExecutionOverview.tsx src/routes/_authenticated/chat.tsx src/routes/_authenticated/tasks.tsx src/routes/_authenticated/meetings.tsx src/routes/_authenticated/projects.tsx src/routes/_authenticated/settings.tsx docs/OVERNIGHT_EMERY_SPRINT_STATUS.md src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m "Unify Emery life operating system [skip ci]"
            git push origin HEAD:main
          fi
