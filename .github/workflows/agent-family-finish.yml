name: Finish Agent Family

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/agent-family-finish.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply Agent Family fixes
        run: python scripts/finish-agent-family.py
      - name: Format
        run: npx prettier --write src/lib/agent-policy.ts src/lib/agent.functions.ts src/lib/emery.functions.ts src/routes/_authenticated/agents.tsx 'src/routes/_authenticated/agents_.$agentId.tsx'
      - name: Production build
        run: npm run build
      - name: TypeScript
        id: tsc
        continue-on-error: true
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc.txt
      - name: Focused lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npx eslint src/lib/agent-policy.ts src/lib/agent.functions.ts src/lib/emery.functions.ts src/routes/_authenticated/agents.tsx 'src/routes/_authenticated/agents_.$agentId.tsx' src/components/AppShell.tsx 2>&1 | tee lint.txt
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-family-validation
          path: |
            tsc.txt
            lint.txt
          retention-days: 1
      - name: Commit validated Agent Family
        if: steps.tsc.outcome == 'success' && steps.lint.outcome == 'success'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/agent-policy.ts src/lib/agent.functions.ts src/lib/emery.functions.ts src/routeTree.gen.ts
            git commit -m "Finish selective Emery Agent Family [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Fail if validation failed
        if: steps.tsc.outcome != 'success' || steps.lint.outcome != 'success'
        run: exit 1
