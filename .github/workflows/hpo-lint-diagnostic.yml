name: HPO Lint Diagnostic

on:
  push:
    branches: [feature/hpo-operating-system]
    paths:
      - '.github/workflows/hpo-lint-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Capture lint diagnostics
        shell: bash
        run: |
          set +e
          npx eslint \
            src/components/AppShell.tsx \
            src/lib/agent.functions.ts \
            src/lib/emery-handoff.ts \
            src/lib/emery.functions.ts \
            src/lib/hpo-agent-context.ts \
            src/lib/hpo-chat-router.ts \
            src/lib/hpo.functions.ts \
            src/routes/_authenticated/hpo.tsx \
            src/routes/_authenticated/capture.tsx \
            --rule '@typescript-eslint/no-explicit-any: off' > hpo-lint-diagnostic.txt 2>&1
          code=$?
          echo "exit_code=$code" >> hpo-lint-diagnostic.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: hpo-lint-diagnostic
          path: hpo-lint-diagnostic.txt
          retention-days: 1
