# Final validation gate for Emery OS, including bounded self-improvement.
name: Validate Emery OS

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-ui.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Emery improvement regression checks
        run: node scripts/validate-emery-improvement.mjs
      - name: Emery Voice activation regression checks
        run: node scripts/validate-emery-voice.mjs
      - name: Phase 0 zero-credit certification
        run: npm run validate:phase0
      - name: Focused Emery OS lint
        run: >-
          npx eslint --rule 'prettier/prettier: off'
          src/components/AppShell.tsx
          src/components/EmeryVoiceControl.tsx
          src/components/ImprovementHealthCard.tsx
          src/lib/agent-policy.ts
          src/lib/agent.functions.ts
          src/lib/assistant-identity.ts
          src/lib/chat-history.functions.ts
          src/lib/chat.functions.ts
          src/lib/runtime-telemetry.ts
          src/lib/model-policy.ts
          src/lib/calendar-agent.ts
          src/lib/dominican-voice-reference.ts
          src/lib/emery-intelligence.ts
          src/lib/emery.functions.ts
          src/lib/hpo-chat-router.ts
          src/lib/improvement.functions.ts
          src/lib/memory.functions.ts
          src/lib/os.functions.ts
          src/lib/voice.functions.ts
          src/lib/voice-profile.ts
          src/lib/voice-session-guard.ts
          src/lib/voice-studio.functions.ts
          src/routes/__root.tsx
          src/routes/_authenticated/chat.tsx
          src/routes/_authenticated/capture.tsx
          src/routes/_authenticated/iphone.tsx
          src/routes/_authenticated/agents.tsx
          'src/routes/_authenticated/agents_.$agentId.tsx'
          src/routes/_authenticated/tasks.tsx
          src/routes/_authenticated/projects.tsx
          src/routes/_authenticated/meetings.tsx
          src/routes/_authenticated/memories.tsx
          src/routes/_authenticated/settings.tsx
