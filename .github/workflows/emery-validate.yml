name: Emery Validate

on:
  push:
    branches:
      - emery-main-action-files-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: emery-main-action-files-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply targeted TypeScript fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/emery.functions.ts')
          s = p.read_text()
          s = s.replace('metadata.pending_action = pending;', 'metadata["pending_action"] = pending;')
          s = s.replace('delete metadata.pending_action;', 'delete metadata["pending_action"];')
          s = s.replace('safeObject(metadata).pending_action;', 'safeObject(metadata)["pending_action"];')
          s = s.replace('updates.description = action.description.trim();', 'updates["description"] = action.description.trim();')
          s = s.replace('updates.goal = action.goal.trim();', 'updates["goal"] = action.goal.trim();')
          s = s.replace('updates.next_action = action.next_action.trim();', 'updates["next_action"] = action.next_action.trim();')
          s = s.replace('updates.status = action.project_status.trim();', 'updates["status"] = action.project_status.trim();')
          s = s.replace('updates.priority = action.priority;', 'updates["priority"] = action.priority;')
          s = s.replace('async function loadRecentHistory(supabase: any, userId: string, conversationId: string) {', 'async function loadRecentHistory(\n  supabase: any,\n  userId: string,\n  conversationId: string,\n): Promise<Array<{ id: string; role: "user" | "assistant"; text: string; createdAt: string }>> {')
          p.write_text(s)

          p = Path('src/routes/_authenticated/tasks.tsx')
          s = p.read_text().replace('?.due_date_only)', '?.["due_date_only"])')
          p.write_text(s)

          p = Path('src/routes/_authenticated/projects.tsx')
          s = p.read_text().replace('await onSave({ id: project?.id, name, goal, description, nextAction, priority, status });', 'await onSave({ ...(project?.id ? { id: project.id } : {}), name, goal, description, nextAction, priority, status });')
          p.write_text(s)
          PY
      - name: Format changed files
        run: npx prettier --write src/lib/emery.functions.ts src/routes/_authenticated/chat.tsx src/routes/_authenticated/tasks.tsx src/routes/_authenticated/projects.tsx src/routes/_authenticated/meetings.tsx src/routes/_authenticated/settings.tsx src/components/AppShell.tsx
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Scoped lint
        run: npx eslint src/lib/emery.functions.ts src/routes/_authenticated/chat.tsx src/routes/_authenticated/tasks.tsx src/routes/_authenticated/projects.tsx src/routes/_authenticated/meetings.tsx src/routes/_authenticated/settings.tsx src/components/AppShell.tsx
      - name: Production build
        run: npm run build
      - name: Commit validated fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/emery.functions.ts src/routes/_authenticated/chat.tsx src/routes/_authenticated/tasks.tsx src/routes/_authenticated/projects.tsx src/routes/_authenticated/meetings.tsx src/routes/_authenticated/settings.tsx src/components/AppShell.tsx
            git commit -m "Fix and format Emery action layer"
            git push origin HEAD:emery-main-action-files-v1
          fi
