name: Fix HPO Router Type

on:
  push:
    branches: [feature/hpo-operating-system]
    paths:
      - '.github/workflows/fix-hpo-router-type.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hpo-operating-system
          fetch-depth: 0
      - name: Fix HPO parser intent type
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/hpo-chat-router.ts')
          s = p.read_text()
          old = '''type HpoParse = HpoPending & {\n  is_hpo: boolean;\n  confidence: number;\n  needs_clarification: boolean;\n  question: string;\n  privacy_risk: boolean;\n};\n'''
          new = '''type HpoParse = Omit<HpoPending, "intent"> & {\n  intent: HpoPending["intent"] | "none";\n  is_hpo: boolean;\n  confidence: number;\n  needs_clarification: boolean;\n  question: string;\n  privacy_risk: boolean;\n};\n'''
          if old not in s:
              if 'intent: HpoPending["intent"] | "none";' in s:
                  raise SystemExit(0)
              raise SystemExit('HpoParse anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and rebase onto latest branch
        run: |
          git config user.name "Emery Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/hpo-chat-router.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix HPO parser none intent typing"
          git fetch origin feature/hpo-operating-system
          git rebase origin/feature/hpo-operating-system
          git push origin HEAD:feature/hpo-operating-system
