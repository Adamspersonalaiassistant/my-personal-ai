name: Finalize HPO Operating System

on:
  push:
    branches: [feature/hpo-operating-system]
    paths:
      - '.github/workflows/finalize-hpo.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hpo-operating-system
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply HPO routing and specialist integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"missing anchor: {label}")
              return text.replace(old, new, 1)

          p = Path('src/lib/hpo-chat-router.ts')
          s = p.read_text()
          s = replace_once(
              s,
              'type HpoParse = HpoPending & {\n  is_hpo: boolean;',
              'type HpoParse = Omit<HpoPending, "intent"> & {\n  intent: HpoPending["intent"] | "none";\n  is_hpo: boolean;',
              'HpoParse intent',
          )
          p.write_text(s)

          p = Path('src/lib/agent.functions.ts')
          s = p.read_text()
          s = replace_once(
              s,
              'import { scopeAgentContext, selectHpoDelegates, shouldResearchWithWeb } from "@/lib/agent-policy";\n',
              'import { scopeAgentContext, selectHpoDelegates, shouldResearchWithWeb } from "@/lib/agent-policy";\nimport { loadHpoAgentContext } from "@/lib/hpo-agent-context";\n',
              'agent HPO import',
          )
          s = replace_once(
              s,
              '''    const rawAdamContext = await loadAdamContext(db, context.userId);\n    const adamContext = scopeAgentContext(rawAdamContext, agent.slug, data.message, {\n      mission: agent.mission,\n      description: agent.description,\n    });\n''',
              '''    const rawAdamContext = await loadAdamContext(db, context.userId);\n    const scopedAdamContext = scopeAgentContext(rawAdamContext, agent.slug, data.message, {\n      mission: agent.mission,\n      description: agent.description,\n    });\n    const adamContext =\n      agent.slug === "hpo-agent"\n        ? {\n            ...scopedAdamContext,\n            hpo_operating_system: await loadHpoAgentContext(db, context.userId, data.message),\n          }\n        : scopedAdamContext;\n''',
              'agent thread HPO context',
          )
          s = replace_once(
              s,
              '''  const rawAdamContext = await loadAdamContext(db, userId);\n  const adamContext = scopeAgentContext(rawAdamContext, agent.slug, assignment, {\n    mission: agent.mission,\n    description: agent.description,\n  });\n''',
              '''  const rawAdamContext = await loadAdamContext(db, userId);\n  const scopedAdamContext = scopeAgentContext(rawAdamContext, agent.slug, assignment, {\n    mission: agent.mission,\n    description: agent.description,\n  });\n  const adamContext =\n    slug === "hpo-agent"\n      ? {\n          ...scopedAdamContext,\n          hpo_operating_system: await loadHpoAgentContext(db, userId, assignment),\n        }\n      : scopedAdamContext;\n''',
              'main consultation HPO context',
          )
          p.write_text(s)

          p = Path('src/lib/emery.functions.ts')
          s = p.read_text()
          s = replace_once(
              s,
              'import { isExplicitAgentCreationCommand, routeMainSpecialist } from "@/lib/agent-policy";\n',
              'import { isExplicitAgentCreationCommand, routeMainSpecialist } from "@/lib/agent-policy";\nimport { processHpoTurn, type HpoTurnResult } from "@/lib/hpo-chat-router";\n',
              'Emery HPO import',
          )
          s = replace_once(
              s,
              '''async function applyAction(\n  supabase: any,\n  userId: string,\n  conversation: { id: string; metadata: unknown },\n  rawAction: ActionCandidate,\n  pending: PendingAction,\n  actionContext: ActionContext,\n  sourceRef: string,\n) {''',
              '''async function applyAction(\n  supabase: any,\n  userId: string,\n  conversation: { id: string; metadata: unknown },\n  rawAction: ActionCandidate,\n  pending: PendingAction,\n  actionContext: ActionContext,\n  sourceRef: string,\n  hpoLink?: { isHpo: boolean; accountId: string | null; accountName: string | null },\n) {''',
              'applyAction HPO argument',
          )
          s = replace_once(
              s,
              '    const taskMetadata = action.due_date_only ? { due_date_only: true } : {};',
              '''    const taskMetadata = {\n      ...(action.due_date_only ? { due_date_only: true } : {}),\n      ...(hpoLink?.isHpo\n        ? {\n            domain: "hpo",\n            hpo: true,\n            ...(hpoLink.accountId ? { hpo_account_id: hpoLink.accountId } : {}),\n          }\n        : {}),\n    };''',
              'HPO task metadata',
          )
          s = replace_once(
              s,
              '        metadata: { source_type: "chat", source_ref: sourceRef },',
              '''        metadata: {\n          source_type: "chat",\n          source_ref: sourceRef,\n          ...(hpoLink?.isHpo\n            ? {\n                domain: "hpo",\n                hpo: true,\n                ...(hpoLink.accountId ? { hpo_account_id: hpoLink.accountId } : {}),\n              }\n            : {}),\n        },''',
              'HPO meeting metadata',
          )

          attachment_anchor = '''    if (data.attachments.length) {\n      const rows = data.attachments.map((attachment) => ({\n        user_id: userId,\n        conversation_id: conversation.id,\n        message_id: userMessage.id,\n        storage_path: attachment.storagePath,\n        file_name: attachment.fileName,\n        mime_type: attachment.mimeType,\n        size_bytes: attachment.sizeBytes,\n      }));\n      const { error } = await db.from("message_attachments").insert(rows);\n      if (error) {\n        console.error("Attachment metadata save failed", error.message);\n        return {\n          error: "Your message was saved, but the attachment couldn't be linked. Please try again.",\n        } as const;\n      }\n    }\n\n'''
          hpo_block = attachment_anchor + '''    let hpoTurn: HpoTurnResult = {\n      isHpo: false,\n      accountId: null,\n      accountName: null,\n      suppressGenericAction: false,\n      instruction: "No HPO-specific write or routing occurred.",\n      context: null,\n      metadata: conversation.metadata,\n    };\n    try {\n      hpoTurn = await processHpoTurn({\n        apiKey,\n        db,\n        userId,\n        conversationId: conversation.id,\n        conversationMetadata: conversation.metadata,\n        message: data.message,\n        sourceRef: userMessage.id,\n      });\n      conversation.metadata = hpoTurn.metadata;\n    } catch (error) {\n      console.error("HPO routing failed", error);\n      hpoTurn.instruction =\n        "HPO routing failed this turn. Do not claim any HPO account or relationship write succeeded.";\n    }\n\n'''
          s = replace_once(s, attachment_anchor, hpo_block, 'HPO turn processing')

          s = replace_once(
              s,
              '''    if (!explicitFact && !looksSensitive(data.message)) {\n      await applyMemoryCandidates(db, userId, data.message, analysis.memories, existingMemories);\n    }\n''',
              '''    if (hpoTurn.suppressGenericAction) {\n      analysis.action = {\n        ...analysis.action,\n        action: "none",\n        confidence: 1,\n        cancel_pending: false,\n        reason: "HPO control requires clarification or privacy protection before generic writes.",\n      };\n    }\n\n    if (!explicitFact && !looksSensitive(data.message)) {\n      await applyMemoryCandidates(db, userId, data.message, analysis.memories, existingMemories);\n    }\n''',
              'HPO generic action suppression',
          )
          s = replace_once(
              s,
              '''        actionContextBefore,\n        userMessage.id,\n      );''',
              '''        actionContextBefore,\n        userMessage.id,\n        {\n          isHpo: hpoTurn.isHpo,\n          accountId: hpoTurn.accountId,\n          accountName: hpoTurn.accountName,\n        },\n      );''',
              'applyAction HPO link call',
          )
          s = replace_once(
              s,
              '''                `\\n\\nACTION CONTROL FOR THIS TURN:\\n${actionInstruction}\\nFollow this control instruction exactly. Do not claim any database action unless it says the action succeeded.` +\n                `\\n\\nAGENT TEAM CONTROL FOR THIS TURN:\\n${agentTeamInstruction || "No agent was created or consulted on this turn."}\\nTreat specialist reports as advisory input. Emery remains the final synthesizer for Adam.` +''',
              '''                `\\n\\nACTION CONTROL FOR THIS TURN:\\n${actionInstruction}\\nFollow this control instruction exactly. Do not claim any database action unless it says the action succeeded.` +\n                `\\n\\nHPO CONTROL FOR THIS TURN:\\n${hpoTurn.instruction}\\nNever claim HPO data was saved unless this instruction says it succeeded. When HPO control asks for a combined confirmation, combine any compatible task/follow-up confirmation into one short question rather than making Adam answer twice.` +\n                `\\n\\nAGENT TEAM CONTROL FOR THIS TURN:\\n${agentTeamInstruction || "No agent was created or consulted on this turn."}\\nTreat specialist reports as advisory input. Emery remains the final synthesizer for Adam.` +''',
              'HPO final system control',
          )
          s = replace_once(
              s,
              '''            {\n              role: "system" as const,\n              content: `CURRENT ACTION CONTEXT:\\n${actionBlock}\\n\\nQUIET EXECUTIVE FOCUS SIGNAL:\\n${focusBlock}\\nUse this focus signal only when relevant. If Adam is overloaded or asks what to do, reduce choices and lead with the highest-leverage next action. Do not turn casual chat into a dashboard. Call out overcomplication or tool-chasing only when the evidence supports it.`,\n            },''',
              '''            ...(hpoTurn.context\n              ? [\n                  {\n                    role: "system" as const,\n                    content: `SCOPED HPO OPERATING CONTEXT (non-PHI relationship and aggregate sales context only):\\n${JSON.stringify(hpoTurn.context).slice(0, 12000)}`,\n                  },\n                ]\n              : []),\n            {\n              role: "system" as const,\n              content: `CURRENT ACTION CONTEXT:\\n${actionBlock}\\n\\nQUIET EXECUTIVE FOCUS SIGNAL:\\n${focusBlock}\\nUse this focus signal only when relevant. If Adam is overloaded or asks what to do, reduce choices and lead with the highest-leverage next action. Do not turn casual chat into a dashboard. Call out overcomplication or tool-chasing only when the evidence supports it.`,\n            },''',
              'HPO prompt context',
          )
          p.write_text(s)
          PY
      - run: npm install --no-audit --no-fund
      - name: Format HPO changes
        run: npx prettier --write src/components/AppShell.tsx src/lib/emery-handoff.ts src/lib/hpo.functions.ts src/lib/hpo-agent-context.ts src/lib/hpo-chat-router.ts src/lib/agent.functions.ts src/lib/emery.functions.ts src/routes/_authenticated/hpo.tsx src/routes/_authenticated/capture.tsx
      - name: Production build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Focused HPO lint
        run: npx eslint --rule '@typescript-eslint/no-explicit-any: off' src/components/AppShell.tsx src/lib/emery-handoff.ts src/lib/hpo.functions.ts src/lib/hpo-agent-context.ts src/lib/hpo-chat-router.ts src/lib/agent.functions.ts src/lib/emery.functions.ts src/routes/_authenticated/hpo.tsx src/routes/_authenticated/capture.tsx
      - name: Commit validated HPO integration
        run: |
          git config user.name "Emery Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/AppShell.tsx src/lib/emery-handoff.ts src/lib/hpo.functions.ts src/lib/hpo-agent-context.ts src/lib/hpo-chat-router.ts src/lib/agent.functions.ts src/lib/emery.functions.ts src/routes/_authenticated/hpo.tsx src/routes/_authenticated/capture.tsx src/routeTree.gen.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finish HPO OS routing and agent integration"
          git push origin HEAD:feature/hpo-operating-system
