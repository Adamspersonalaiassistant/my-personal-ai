name: Agent Family Diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agent-family-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Production build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.txt
      - name: TypeScript
        id: tsc
        continue-on-error: true
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc.txt
      - name: Agent focused lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npx eslint src/lib/agent.functions.ts src/lib/emery.functions.ts src/routes/_authenticated/agents.tsx 'src/routes/_authenticated/agents_.$agentId.tsx' src/components/AppShell.tsx 2>&1 | tee lint.txt
      - name: Summary
        run: |
          {
            echo "build=${{ steps.build.outcome }}"
            echo "tsc=${{ steps.tsc.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
          } > status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-family-diagnostics
          path: |
            build.txt
            tsc.txt
            lint.txt
            status.txt
          retention-days: 1
