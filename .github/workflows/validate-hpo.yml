name: Validate HPO Operating System

on:
  push:
    branches: [feature/hpo-operating-system]
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - '.github/workflows/validate-hpo.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - '.github/workflows/validate-hpo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Focused HPO lint
        run: >-
          npx eslint --rule 'prettier/prettier: off'
          src/components/AppShell.tsx
          src/lib/agent.functions.ts
          src/lib/emery-handoff.ts
          src/lib/emery.functions.ts
          src/lib/hpo-agent-context.ts
          src/lib/hpo-action-controller.ts
          src/lib/hpo-chat-router.ts
          src/lib/hpo.functions.ts
          src/routes/_authenticated/hpo.tsx
          src/routes/_authenticated/capture.tsx
          --rule '@typescript-eslint/no-explicit-any: off'
