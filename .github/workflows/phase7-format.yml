name: Format Emery Phase 7

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase7-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write src/lib/chat-history.functions.ts src/routes/_authenticated/chat.tsx src/components/AppShell.tsx
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/chat-history.functions.ts src/routes/_authenticated/chat.tsx src/components/AppShell.tsx
            git commit -m "Format Phase 7 mobile polish [skip ci]"
            git push origin HEAD:main
          fi
