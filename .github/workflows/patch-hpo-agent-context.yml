name: Finalize HPO Integration

on:
  push:
    branches: [feature/hpo-operating-system]
    paths:
      - '.github/workflows/patch-hpo-agent-context.yml'
      - 'src/lib/hpo-agent-context.ts'
      - 'src/lib/hpo-chat-router.ts'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hpo-operating-system
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize HPO routing, agent context, and Emery integration
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/agent.functions.ts')
          s = p.read_text()
          old_import = 'import { scopeAgentContext, selectHpoDelegates, shouldResearchWithWeb } from "@/lib/agent-policy";\n'
          new_import = old_import + 'import { loadHpoAgentContext } from "@/lib/hpo-agent-context";\n'
          if 'from "@/lib/hpo-agent-context"' not in s:
              if old_import not in s: raise SystemExit('agent-policy import anchor missing')
              s = s.replace(old_import, new_import, 1)
          old1 = '''    const rawAdamContext = await loadAdamContext(db, context.userId);\n    const adamContext = scopeAgentContext(rawAdamContext, agent.slug, data.message, {\n      mission: agent.mission,\n      description: agent.description,\n    });\n'''
          new1 = '''    const rawAdamContext = await loadAdamContext(db, context.userId);\n    const scopedAdamContext = scopeAgentContext(rawAdamContext, agent.slug, data.message, {\n      mission: agent.mission,\n      description: agent.description,\n    });\n    const adamContext =\n      agent.slug === "hpo-agent"\n        ? {\n            ...scopedAdamContext,\n            hpo_operating_system: await loadHpoAgentContext(db, context.userId, data.message),\n          }\n        : scopedAdamContext;\n'''
          if old1 in s:
              s = s.replace(old1, new1, 1)
          elif 'hpo_operating_system: await loadHpoAgentContext(db, context.userId, data.message)' not in s:
              raise SystemExit('sendAgentMessage context anchor missing')
          old2 = '''  const rawAdamContext = await loadAdamContext(db, userId);\n  const adamContext = scopeAgentContext(rawAdamContext, agent.slug, assignment, {\n    mission: agent.mission,\n    description: agent.description,\n  });\n'''
          new2 = '''  const rawAdamContext = await loadAdamContext(db, userId);\n  const scopedAdamContext = scopeAgentContext(rawAdamContext, agent.slug, assignment, {\n    mission: agent.mission,\n    description: agent.description,\n  });\n  const adamContext =\n    slug === "hpo-agent"\n      ? {\n          ...scopedAdamContext,\n          hpo_operating_system: await loadHpoAgentContext(db, userId, assignment),\n        }\n      : scopedAdamContext;\n'''
          if old2 in s:
              s = s.replace(old2, new2, 1)
          elif 'hpo_operating_system: await loadHpoAgentContext(db, userId, assignment)' not in s:
              raise SystemExit('consult context anchor missing')
          p.write_text(s)

          r = Path('src/lib/hpo-chat-router.ts')
          rs = r.read_text()
          if not rs.startswith('/* eslint-disable @typescript-eslint/no-explicit-any */'):
              rs = '/* eslint-disable @typescript-eslint/no-explicit-any */\n' + rs
          old_type = '''type HpoParse = HpoPending & {\n  is_hpo: boolean;\n  confidence: number;\n  needs_clarification: boolean;\n  question: string;\n  privacy_risk: boolean;\n};\n'''
          new_type = '''type HpoParse = Omit<HpoPending, "intent"> & {\n  intent: HpoPending["intent"] | "none";\n  is_hpo: boolean;\n  confidence: number;\n  needs_clarification: boolean;\n  question: string;\n  privacy_risk: boolean;\n};\n'''
          if old_type in rs:
              rs = rs.replace(old_type, new_type, 1)
          elif 'intent: HpoPending["intent"] | "none";' not in rs:
              raise SystemExit('HpoParse type anchor missing')
          r.write_text(rs)

          e = Path('src/lib/emery.functions.ts')
          es = e.read_text()
          import_anchor = 'import { isExplicitAgentCreationCommand, routeMainSpecialist } from "@/lib/agent-policy";\n'
          if 'from "@/lib/hpo-chat-router"' not in es:
              if import_anchor not in es: raise SystemExit('Emery import anchor missing')
              es = es.replace(import_anchor, import_anchor + 'import { processHpoTurn, type HpoTurnResult } from "@/lib/hpo-chat-router";\n', 1)
          stated_anchor = '    const statedName = extractName(data.message);\n'
          hpo_block = '''    let hpoTurn: HpoTurnResult = {\n      isHpo: false,\n      accountId: null,\n      accountName: null,\n      suppressGenericAction: false,\n      instruction: "No HPO-specific write or routing occurred.",\n      context: null,\n      metadata: conversation.metadata,\n    };\n    if (data.message) {\n      try {\n        hpoTurn = await processHpoTurn({\n          apiKey,\n          db,\n          userId,\n          conversationId: conversation.id,\n          conversationMetadata: conversation.metadata,\n          message: data.message,\n          sourceRef: userMessage.id,\n        });\n        conversation.metadata = hpoTurn.metadata;\n      } catch (error) {\n        console.error("HPO routing failed", error);\n        hpoTurn.instruction =\n          "HPO routing failed for this turn. Do not claim an HPO write occurred.";\n      }\n    }\n\n'''
          if 'let hpoTurn: HpoTurnResult' not in es:
              if stated_anchor not in es: raise SystemExit('Emery HPO insertion anchor missing')
              es = es.replace(stated_anchor, hpo_block + stated_anchor, 1)
          memory_anchor = '    if (!explicitFact && !looksSensitive(data.message)) {\n'
          suppress_block = '''    if (hpoTurn.suppressGenericAction) {\n      analysis.action = {\n        ...analysis.action,\n        action: "none",\n        confidence: 1,\n        needs_confirmation: false,\n        question: "",\n        cancel_pending: false,\n      };\n    }\n\n'''
          if 'if (hpoTurn.suppressGenericAction)' not in es:
              if memory_anchor not in es: raise SystemExit('Emery HPO suppression anchor missing')
              es = es.replace(memory_anchor, suppress_block + memory_anchor, 1)
          profile_anchor = '    const [{ data: profile }, { data: memories }, actionContextAfter] = await Promise.all([\n'
          tagging_block = '''    if (hpoTurn.isHpo) {\n      const hpoTag: Record<string, unknown> = { domain: "hpo", hpo: true };\n      if (hpoTurn.accountId) hpoTag["hpo_account_id"] = hpoTurn.accountId;\n      if (hpoTurn.accountName) hpoTag["hpo_account_name"] = hpoTurn.accountName;\n      try {\n        const { data: createdTasks } = await db\n          .from("tasks")\n          .select("id, metadata")\n          .eq("user_id", userId)\n          .eq("source_ref", userMessage.id);\n        for (const task of createdTasks ?? []) {\n          await db\n            .from("tasks")\n            .update({ metadata: { ...safeObject(task.metadata), ...hpoTag } })\n            .eq("id", task.id)\n            .eq("user_id", userId);\n        }\n        const { data: createdMeetings } = await db\n          .from("meetings")\n          .select("id, metadata")\n          .eq("user_id", userId)\n          .contains("metadata", { source_ref: userMessage.id });\n        for (const meeting of createdMeetings ?? []) {\n          await db\n            .from("meetings")\n            .update({ metadata: { ...safeObject(meeting.metadata), ...hpoTag } })\n            .eq("id", meeting.id)\n            .eq("user_id", userId);\n        }\n      } catch (error) {\n        console.error("HPO task/meeting tagging failed", error);\n      }\n    }\n\n'''
          if 'HPO task/meeting tagging failed' not in es:
              if profile_anchor not in es: raise SystemExit('Emery HPO tagging anchor missing')
              es = es.replace(profile_anchor, tagging_block + profile_anchor, 1)
          focus_anchor = '    const focusBlock = buildExecutiveFocus(actionContextAfter);\n'
          hpo_context_line = '''    const hpoContextBlock = hpoTurn.context\n      ? JSON.stringify(hpoTurn.context).slice(0, 12000)\n      : "";\n'''
          if 'const hpoContextBlock = hpoTurn.context' not in es:
              if focus_anchor not in es: raise SystemExit('Emery HPO context anchor missing')
              es = es.replace(focus_anchor, focus_anchor + hpo_context_line, 1)
          agent_control_anchor = '''                `\\n\\nACTION CONTROL FOR THIS TURN:\\n${actionInstruction}\\nFollow this control instruction exactly. Do not claim any database action unless it says the action succeeded.` +\n                `\\n\\nAGENT TEAM CONTROL FOR THIS TURN:\\n${agentTeamInstruction || "No agent was created or consulted on this turn."}\\nTreat specialist reports as advisory input. Emery remains the final synthesizer for Adam.` +\n'''
          agent_control_replacement = '''                `\\n\\nACTION CONTROL FOR THIS TURN:\\n${actionInstruction}\\nFollow this control instruction exactly. Do not claim any database action unless it says the action succeeded.` +\n                `\\n\\nHPO WORK CONTROL FOR THIS TURN:\\n${hpoTurn.instruction}\\nTreat HPO as Adam's Hudson Pro career operating system. Route work context into HPO when appropriate, keep identifiable patient/case/medical information out of this work OS, and ask at most one concise clarification when the account or write intent is genuinely ambiguous.` +\n                (hpoContextBlock\n                  ? `\\n\\nHPO OPERATING CONTEXT (bounded non-PHI account/relationship intelligence):\\n${hpoContextBlock}`\n                  : "") +\n                `\\n\\nAGENT TEAM CONTROL FOR THIS TURN:\\n${agentTeamInstruction || "No agent was created or consulted on this turn."}\\nTreat specialist reports as advisory input. Emery remains the final synthesizer for Adam.` +\n'''
          if 'HPO WORK CONTROL FOR THIS TURN' not in es:
              if agent_control_anchor not in es: raise SystemExit('Emery system prompt anchor missing')
              es = es.replace(agent_control_anchor, agent_control_replacement, 1)
          e.write_text(es)

          h = Path('src/routes/_authenticated/hpo.tsx')
          hs = h.read_text()
          hs = hs.replace('href="/chat?prefill=I%20need%20to%20log%20an%20HPO%20update%3A%20"', 'href="/capture?context=hpo"')
          hs = hs.replace('href="/chat?prefill=What%20is%20the%20highest-leverage%20HPO%20action%20I%20should%20do%20next%3F"', 'href="/capture?context=hpo&text=What%20is%20the%20highest-leverage%20HPO%20action%20I%20should%20do%20next%3F&autosend=1"')
          h.write_text(hs)
          PY
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write src/lib/agent.functions.ts src/lib/hpo-agent-context.ts src/lib/hpo-chat-router.ts src/lib/emery.functions.ts src/lib/hpo.functions.ts src/routes/_authenticated/hpo.tsx src/routes/_authenticated/capture.tsx
      - run: npm run build
      - run: npx tsc --noEmit
      - run: >-
          npx eslint
          src/lib/agent.functions.ts
          src/lib/hpo-agent-context.ts
          src/lib/hpo-chat-router.ts
          src/lib/emery.functions.ts
          src/lib/hpo.functions.ts
          src/routes/_authenticated/hpo.tsx
          src/routes/_authenticated/capture.tsx
          src/components/AppShell.tsx
          src/lib/emery-handoff.ts
          --rule '@typescript-eslint/no-explicit-any: off'
      - name: Commit validated integration
        run: |
          git config user.name "Emery Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/agent.functions.ts src/lib/hpo-agent-context.ts src/lib/hpo-chat-router.ts src/lib/emery.functions.ts src/lib/hpo.functions.ts src/routes/_authenticated/hpo.tsx src/routes/_authenticated/capture.tsx src/routeTree.gen.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finish HPO operating system integration"
          git push origin HEAD:feature/hpo-operating-system
