name: Validate Emery Phase 7

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase7-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: TypeScript diagnostics
        id: tsc
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > phase7-tsc.txt 2>&1
          code=$?
          cat phase7-tsc.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Focused lint diagnostics
        id: lint
        shell: bash
        run: |
          set +e
          npx eslint src/lib/chat-history.functions.ts src/routes/_authenticated/chat.tsx src/components/AppShell.tsx src/routes/__root.tsx > phase7-lint.txt 2>&1
          code=$?
          cat phase7-lint.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: phase7-diagnostics
          path: |
            phase7-tsc.txt
            phase7-lint.txt
          retention-days: 1
      - name: Enforce validation
        shell: bash
        run: |
          if [ "${{ steps.tsc.outputs.exit_code }}" != "0" ] || [ "${{ steps.lint.outputs.exit_code }}" != "0" ]; then
            echo "Phase 7 validation failed"
            exit 1
          fi
