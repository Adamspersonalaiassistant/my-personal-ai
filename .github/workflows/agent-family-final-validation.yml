name: Agent Family Final Validation

on:
  push:
    paths:
      - .github/workflows/agent-family-final-validation.yml

permissions:
  contents: read

jobs:
  validate-final-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Emery improvement regression checks
        run: node scripts/validate-emery-improvement.mjs
      - name: Focused Emery OS lint
        run: >-
          npx eslint
          src/components/AppShell.tsx
          src/components/ImprovementHealthCard.tsx
          src/lib/agent-policy.ts
          src/lib/agent.functions.ts
          src/lib/assistant-identity.ts
          src/lib/chat-history.functions.ts
          src/lib/chat.functions.ts
          src/lib/emery-intelligence.ts
          src/lib/emery.functions.ts
          src/lib/improvement.functions.ts
          src/lib/memory.functions.ts
          src/lib/os.functions.ts
          src/routes/__root.tsx
          src/routes/_authenticated/chat.tsx
          src/routes/_authenticated/agents.tsx
          'src/routes/_authenticated/agents_.$agentId.tsx'
          src/routes/_authenticated/tasks.tsx
          src/routes/_authenticated/projects.tsx
          src/routes/_authenticated/meetings.tsx
          src/routes/_authenticated/memories.tsx
          src/routes/_authenticated/settings.tsx
      - name: Agent policy assertions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const policy = fs.readFileSync('src/lib/agent-policy.ts', 'utf8');
          const fn = fs.readFileSync('src/lib/agent.functions.ts', 'utf8');
          const agentsUi = fs.readFileSync('src/routes/_authenticated/agents.tsx', 'utf8');
          const agentChat = fs.readFileSync('src/routes/_authenticated/agents_.$agentId.tsx', 'utf8');
          const checks = [
            ['agent creation accepts set up/spin up', policy.includes('set up|spin up')],
            ['hypothetical creation remains blocked', policy.includes('should i|could i|would i|what if')],
            ['scout routing is evidence-oriented', policy.includes('look up|search|discover|prospect|new target')],
            ['context has scoped profile', policy.includes('function scopedProfile')],
            ['custom capabilities are allowlisted', fn.includes('web_search: input.capabilities?.["web_search"] === true')],
            ['thread race recovery is present', fn.includes('error?.code === "23505"')],
            ['recoverable specialist error is persisted', fn.includes('recoverable_error: true')],
            ['agents distinguish core and custom', agentsUi.includes('agent.is_custom ? "Custom" : "Core"')],
            ['Emery leadership is visible on mobile', agentChat.includes('min-[380px]:hidden">Lead')],
          ];
          for (const [name, ok] of checks) console.log(`${ok ? 'PASS' : 'FAIL'} ${name}`);
          if (checks.some(([, ok]) => !ok)) process.exit(1);
          NODE
